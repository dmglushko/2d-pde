<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pde2d</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 14 L8 2 L14 14 Z M5 8 L11 8 M8 14 L5 8 M8 14 L11 8' fill='none' stroke='%232a78d6' stroke-width='1.5'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">pde2d <small id="version"></small></div>
      <div class="case-actions">
        <button id="new-case" type="button">New</button>
        <select id="examples" aria-label="Open an example">
          <option value="">Examples…</option>
        </select>
        <label class="button"
          >Open case…<input id="open-case" type="file" accept=".json,application/json" hidden
        /></label>
        <button id="save-case" type="button">Save case</button>
        <span id="unsaved" class="chip" hidden>unsaved changes</span>
        <button id="run-all" class="primary" type="button">Run all</button>
      </div>
    </header>

    <div id="case-notice"></div>

    <main class="layout">
      <aside class="sidebar">
        <!-- The steps and their panels come from the stage registry
             (js/core.js, STAGES). -->
        <nav class="steps" role="tablist" aria-label="Steps"></nav>
        <div class="panels"></div>
      </aside>

      <section class="viewer" aria-label="Picture">
        <div class="viewer-toolbar">
          <label><input type="checkbox" id="layer-geometry" checked /> Boundary</label>
          <label><input type="checkbox" id="layer-mesh" checked /> Mesh edges</label>
          <label><input type="checkbox" id="layer-dirichlet" /> Dirichlet nodes</label>
          <label
            >Colour
            <select id="color-by">
              <option value="none">none</option>
              <option value="quality">smallest angle</option>
              <option value="field">field</option>
            </select>
          </label>
          <button id="fit-view" class="small" type="button">Fit</button>
          <span class="status" id="view-status"></span>
        </div>
        <div class="canvas-wrap" id="canvas-wrap">
          <canvas id="view" aria-label="Geometry and mesh"></canvas>
          <div class="empty-view" id="empty-view">Choose a geometry, or drop an SVG, .msh or .pde2d file here.</div>
          <div class="tooltip" id="tooltip" hidden></div>
        </div>
        <div class="legend" id="legend"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
