<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>pde2d</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 14 L8 2 L14 14 Z M5 8 L11 8 M8 14 L5 8 M8 14 L11 8' fill='none' stroke='%233987e5' stroke-width='1.5'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/panels.css" />
    <link rel="stylesheet" href="css/picture.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">pde2d <small id="version"></small></div>
      <div class="case-actions">
        <div class="case-menu">
          <button id="case-menu-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="case-menu">
            Case<span class="case-name" id="case-name"></span><span class="menu-caret" aria-hidden="true">▾</span>
          </button>
          <div id="case-menu" class="menu" role="menu" aria-labelledby="case-menu-button" hidden>
            <button id="new-case" type="button" role="menuitem">New case</button>
            <button id="open-case-button" type="button" role="menuitem">Open case…</button>
            <button id="save-case" type="button" role="menuitem">Save case</button>
            <button id="restore-case" type="button" role="menuitem" hidden>Restore previous case</button>
            <div class="menu-separator" role="separator"></div>
            <button id="undo" type="button" role="menuitem" aria-keyshortcuts="Control+Z" disabled>Undo <kbd aria-hidden="true">Ctrl+Z</kbd></button>
            <button id="redo" type="button" role="menuitem" aria-keyshortcuts="Control+Shift+Z" disabled>Redo <kbd aria-hidden="true">Ctrl+Shift+Z</kbd></button>
            <div class="menu-separator" role="separator"></div>
            <div class="menu-heading" id="examples-heading">Examples</div>
            <div id="examples" role="group" aria-labelledby="examples-heading"></div>
            <div class="menu-separator" role="separator"></div>
            <div class="menu-heading" id="presets-heading" title="Fills in the problem and the solve settings; the geometry and the mesh stay">Problems on this geometry</div>
            <div id="problem-presets" role="group" aria-labelledby="presets-heading"></div>
          </div>
        </div>
        <input id="open-case" type="file" accept=".json,application/json" tabindex="-1" hidden />
        <span id="unsaved" class="chip" hidden>unsaved</span>
        <span id="server-status" class="server-status" role="status" hidden></span>
        <button id="run-all" class="primary" type="button">Run all</button>
        <button id="open-settings" class="icon" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog">⚙</button>
      </div>
    </header>

    <div id="case-notice"></div>

    <main class="layout">
      <aside class="sidebar" id="sidebar">
        <!-- The steps and their panels come from the stage registry
             (js/core.js, STAGES). -->
        <nav class="steps" role="tablist" aria-label="Steps"></nav>
        <div class="panels"></div>
        <div
          class="sidebar-handle"
          id="sidebar-handle"
          role="separator"
          aria-orientation="vertical"
          aria-controls="sidebar"
          aria-label="Sidebar width: drag, or use the arrow keys; double-click for the default"
          aria-valuemin="300"
          tabindex="0"
        ></div>
      </aside>

      <section class="viewer" aria-label="Picture">
        <div class="viewer-main">
          <div class="viewer-toolbar">
            <label><input type="checkbox" id="layer-geometry" checked /> Boundary</label>
            <label><input type="checkbox" id="layer-mesh" checked /> Edges</label>
            <label title="Dirichlet nodes"><input type="checkbox" id="layer-dirichlet" /> Dirichlet</label>
            <label><input type="checkbox" id="layer-isolines" /> Isolines</label>
            <label
              ><span class="toolbar-label">Colour</span>
              <select id="color-by" aria-label="Colour">
                <option value="none">none</option>
                <option value="quality">smallest angle</option>
                <option value="field">field</option>
                <option value="gradient">|∇| of the field</option>
                <option value="indicator">error indicator η (log₁₀)</option>
              </select>
            </label>
            <button id="profile-tool" class="small" type="button" aria-pressed="false" title="Drag across the picture to plot the shown field along a line"><span class="wide-only">Line profile</span><span class="phone-only">Profile</span></button>
            <button id="reset-view" class="small wide-only" type="button" title="Centre the whole domain in the picture again (also: double-click, or 0)">Reset view</button>
            <button id="save-picture" class="small" type="button" title="Save the picture with its legend as PNG">Save<span class="wide-only"> picture</span></button>
            <button id="collapse-picture" class="icon phone-only" type="button" aria-expanded="true" aria-controls="canvas-wrap" aria-label="Hide the picture" title="Hide the picture">▴</button>
            <span class="status" id="view-status"></span>
          </div>
          <div class="canvas-wrap" id="canvas-wrap">
            <canvas
              id="view"
              tabindex="0"
              aria-label="Picture of the domain, the mesh and the field. Arrow keys pan, + and - zoom, 0 fits, Enter pins a probe at the centre."
            ></canvas>
            <div class="empty-view" id="empty-view">Choose a geometry, or drop an SVG, .msh or .pde2d file here.</div>
            <div class="tooltip" id="tooltip" hidden></div>
            <div class="view-stamp" id="view-stamp" hidden>Outdated: the case changed since this result</div>
            <div class="view-overlay" id="view-overlay" role="status" hidden></div>
            <div class="zoom-buttons" role="group" aria-label="Zoom">
              <button id="zoom-in" class="icon" type="button" aria-label="Zoom in" title="Zoom in (+)">+</button>
              <button id="zoom-out" class="icon" type="button" aria-label="Zoom out" title="Zoom out (−)">−</button>
              <button id="fit-view" class="icon" type="button" aria-label="Fit the picture" title="Fit the picture (0)">⌂</button>
            </div>
          </div>
          <div
            class="picture-handle"
            id="picture-handle"
            role="separator"
            aria-orientation="horizontal"
            aria-label="Picture height: drag, or use the arrow keys"
            aria-valuemin="160"
            tabindex="0"
          ></div>
          <div class="timebar" id="timebar" hidden></div>
          <div class="legend" id="legend"></div>
        </div>
        <div class="viewer-extra" id="probes" hidden>
          <div class="probe-list"></div>
          <div class="probe-chart" hidden></div>
          <div class="profile-chart" hidden></div>
        </div>
      </section>
    </main>

    <dialog id="settings" class="settings" aria-labelledby="settings-title">
      <div class="settings-head">
        <h2 id="settings-title">Settings</h2>
        <button type="button" class="icon" data-close aria-label="Close settings">✕</button>
      </div>
      <div class="settings-body"></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
